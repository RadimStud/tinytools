name: Report a problem
description: Help us reproduce a problem with a MiniKit tool.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, signed download links, or confidential files. Redact screenshots and use synthetic data."
  - type: input
    id: tool
    attributes:
      label: Tool or page
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
