name: P2 dependency preparation
on:
  push:
    branches: [feature/platform-p2-gateway]
    paths: [.github/workflows/p2-preparation.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'RadimStud/tinytools' && github.ref == 'refs/heads/feature/platform-p2-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-p2-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add established JOSE library with npm-generated lockfile
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --package-lock-only --ignore-scripts --save-exact jose@6.1.3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add jose 6.1.3 for signed platform service assertions'
            git push origin HEAD:refs/heads/feature/platform-p2-gateway
          fi
      - run: npm ci
      - name: Export source and dependencies for offline validation
        run: |
          mkdir -p /tmp/p2-export
          git archive HEAD | tar -x -C /tmp/p2-export
          cp -a node_modules /tmp/p2-export/
          tar -czf /tmp/p2-source-runtime.tar.gz -C /tmp/p2-export .
          if [ -d node_modules/next/dist/docs ]; then find node_modules/next/dist/docs -iname '*auth*' -o -iname '*route*'; fi
      - uses: actions/upload-artifact@v4
        with:
          name: p2-source-runtime
          path: /tmp/p2-source-runtime.tar.gz
          retention-days: 1
