name: Workbench browser tests
on:
  push:
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tinytools
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npx playwright test --config=playwright.workbench.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-results
          path: test-results/
          retention-days: 7
